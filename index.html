function drawShip(p,i){if(!p.on||p.dead)return;X.save();
 if(p.shT>0){X.strokeStyle='rgba(100,200,255,'+(0.45+Math.sin(S.t*10)*0.2)+')';X.lineWidth=3;X.beginPath();X.arc(p.x,p.y+6,20+Math.sin(S.t*8)*2,0,6.283);X.stroke()}
 X.fillStyle=TC[p.ty|0]+'55';X.beginPath();X.arc(p.x,p.y+10,14+p.lv*2.5,0,6.283);X.fill();
 if(p.inv>0&&((S.t*20)|0)%2)X.globalAlpha=.4;const F=i?IM.p2:IM.pl;spr(F[((S.t*12)|0)%F.length],p.x,p.y+8,.9,p.hf>0);X.restore()}
function drawEnemy(e){const th=(S.st-1)%3,k=e.k;
 // Boss with unique telegraphs
 if(k=='b'){
  spr(IM.bs[(S.st-1)%4],e.x,e.y,1.05,e.hf>0);
  // Weak point ring
  if(e.open>0){X.strokeStyle='#ff4';X.lineWidth=4;X.beginPath();X.arc(e.x,e.y,e.r*.75+Math.sin(S.t*20)*3,0,6.283);X.stroke()}
  const bid=(S.st-1)%4;
  // Gunship dive warning
  if(bid===2&&e.dive>0){X.save();X.strokeStyle='rgba(255,120,40,0.85)';X.lineWidth=3;X.setLineDash([8,5]);X.beginPath();X.moveTo(e.x,e.y);X.lineTo(e.dx||e.x,H-40);X.stroke();X.setLineDash([]);X.restore()}
  // Skull death-ray telegraph
  if(bid===3&&e.ray>0){X.save();X.strokeStyle='rgba(255,40,40,0.7)';X.lineWidth=6+Math.sin(S.t*25)*2;X.globalAlpha=.5+Math.sin(S.t*18)*.3;X.beginPath();X.moveTo(e.x,e.y);X.lineTo(e.rx||e.x,H);X.stroke();X.globalAlpha=1;X.restore()}
  // Bio pulse
  if(bid===1&&e.open<=0){X.save();X.strokeStyle='rgba(80,255,120,0.35)';X.lineWidth=2;X.beginPath();X.arc(e.x,e.y,e.r+10+Math.sin(S.t*8)*4,0,6.283);X.stroke();X.restore()}
  return;
 }
 // Guardian shield
 if(k=='g'&&e.shield>0){X.strokeStyle='#4df';X.lineWidth=3;X.beginPath();X.arc(e.x,e.y,e.r+6,0,6.283);X.stroke()}
 // Sniper telegraph (aim line)
 if(k=='n'&&e.tl){X.save();X.strokeStyle='rgba(255,80,80,0.75)';X.lineWidth=2;X.setLineDash([6,4]);X.beginPath();X.moveTo(e.x,e.y);X.lineTo(e.tx,e.ty);X.stroke();X.setLineDash([]);X.fillStyle='rgba(255,60,60,0.35)';X.beginPath();X.arc(e.tx,e.ty,10+Math.sin(S.t*12)*3,0,6.283);X.fill();X.restore()}
 // Rusher charge indicator
 if(k=='m'&&e.charge>0){X.save();X.strokeStyle='#fa4';X.lineWidth=2;X.globalAlpha=.6+Math.sin(S.t*20)*.3;X.beginPath();X.arc(e.x,e.y,e.r+8+Math.sin(S.t*15)*4,0,6.283);X.stroke();X.globalAlpha=1;X.restore()}
 if(GK.includes(k)){drawGround(e);if(e.elite){X.strokeStyle='#fd5';X.lineWidth=2;X.beginPath();X.arc(e.x,e.y,e.r+6,0,6.283);X.stroke()}return}
 // Sprite selection
 const g=EG[((k=='z'?0:k=='v'?1:2)+th)%3];spr(g[((S.t*8+e.x/40)|0)%g.length],e.x,e.y,k=='s'?1.3:k=='g'?1.15:.85,e.hf>0);
