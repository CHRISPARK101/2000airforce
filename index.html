<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>가변 메카 슈터 · 탑뷰</title>
<style>
:root{--bg:#07131f;--fg:#e8f1ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07131f;--fg:#e8f1ff}}
:root[data-theme="dark"]{--bg:#07131f;--fg:#e8f1ff}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
canvas{height:100%;max-width:100%;aspect-ratio:3/5;background:#123}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#07131fee;z-index:5;padding:20px;text-align:center}
#menu h1{margin:0 0 10px;font-size:28px;letter-spacing:2px}

#row{display:flex;gap:8px;align-items:center}#row button{min-width:0;padding:12px 16px}
#info{min-height:40px;font-size:15px;color:#ffd34d;max-width:320px}
</style></head><body>
<canvas id="c"></canvas>
<div id="menu"><h1>MECHA SHOOTER</h1><button id="b1">혼자 하기</button><button id="b2">방 만들기 (2인 협동)</button><div id="row"><input id="code" placeholder="방 코드" inputmode="numeric" maxlength="4"><button id="b3">참가</button></div><div id="info"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='',SB_KEY=''; // ← Supabase 프로젝트 URL과 anon key를 여기에 넣으세요 (테트리스에서 쓴 것과 같은 값)
const C=document.getElementById('c'),X=C.getContext('2d'),W=480,H=800,PR=8;C.width=W;C.height=H;
const ST=[{n:'지상 · 사막 협곡',bg:['#d2b277','#8f6c3a'],boss:'지상 요새'},{n:'해상 · 태평양',bg:['#0f4c81','#1f78b4'],boss:'전함'},{n:'우주 · 궤도',bg:['#02030a','#10143a'],boss:'우주 모함'}],SL=200,ISC=[['#a07a45','#7d5a30'],['#c9b27a','#4a8a3a'],['#3a3f66','#555b8a']];
const IC={H:'#3d5',P:'#7ff',M:'#fb5',S:'#af6',L:'#ff9',O:'#fd5'},WK=['레이저','미사일','산탄','낙뢰','옵션'];
const K={},ptr={d:false,x:0,y:0},R=(a,b)=>a+Math.random()*(b-a),D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),$=id=>document.getElementById(id);
let S,last=0,run=false,isl=[],net={mode:'solo',guest:0,started:0,sa:0,ti:0,rt:0,last:0,ch:null};
for(let i=0;i<7;i++)isl.push({x:R(0,W),y:R(0,H+200),w:R(60,140),h:R(40,90)});
const stars=[];for(let i=0;i<60;i++)stars.push({x:R(0,W),y:R(0,H),z:R(1,3),a:R(.3,1)});
const newP=i=>({x:W/2+(i?60:-60),y:H-130,hp:100,inv:0,hf:0,rv:0,dead:0,on:!i,wl:[1,0,0,0,0],cds:[0,0,0,0,0],in:{dx:0,dy:0,d:0,tx:0,ty:0}});
function reset(n){S={t:0,sc:0,e:[],b:[],eb:[],p:[],it:[],L:[],q:[],sp:1,boss:0,over:false,st:1,msg:'',mt:0,bg:0,sh:0,tm:0,ph:0,ct:0,s0:0,P:[newP(0),newP(1)]};S.P[1].on=n==2;intro()}
function intro(){S.msg='STAGE '+S.st+'  '+ST[(S.st-1)%3].n;S.mt=3}
function nextStage(){const s=S;s.st++;s.tm=0;s.ph=0;s.boss=0;s.e=[];s.eb=[];s.it=[];s.b=[];s.sp=1;s.s0=s.sc;for(const p of s.P)if(p.on){p.hp=Math.min(100,p.hp+40);if(p.dead){p.dead=0;p.hp=50}p.inv=2}intro()}
function cont(){const s=S,k={st:s.st,sc:s.s0,w:s.P.map(p=>p.wl),n:s.P[1].on?2:1};reset(k.n);Object.assign(S,{st:k.st,sc:k.sc,s0:k.sc});S.P.forEach((p,i)=>p.wl=k.w[i]);intro()}
const alive=()=>S.P.filter(p=>p.on&&!p.dead),np=()=>S.P[1].on?1.6:1;
function tgt(e){let b=null,bd=1e9;for(const p of alive()){const d=D(e,p);if(d<bd){bd=d;b=p}}return b||S.P[0]}
function burst(x,y,n,c,sp){for(let i=0;i<n;i++){const a=R(0,6.283),v=R(.2,1)*sp;S.p.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:R(.3,.7),c,r:R(1.5,4)})}if(net.mode=='host')S.q.push([x|0,y|0,n,c,sp])}
const localIn=()=>({dx:(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),dy:(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0),d:ptr.d?1:0,tx:Math.round(ptr.x),ty:Math.round(ptr.y)});
addEventListener('keydown',e=>{if(document.activeElement.tagName=='INPUT')return;const k=e.key.toLowerCase();if(['arrowup','arrowdown',' '].includes(k))e.preventDefault();if(K[k])return;K[k]=1;
 if(run&&net.mode!='guest'){if(S.over&&(k=='enter'||k==' '))cont();if(k=='n')S.tm=SL-1}});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=0});
const pos=e=>{const r=C.getBoundingClientRect();ptr.x=(e.clientX-r.left)*W/r.width;ptr.y=(e.clientY-r.top)*H/r.height};
C.addEventListener('pointerdown',e=>{pos(e);if(S.over&&net.mode!='guest'){cont();return}ptr.d=true});
C.addEventListener('pointermove',pos);addEventListener('pointerup',()=>{ptr.d=false});
C.addEventListener('contextmenu',e=>e.preventDefault());

function eshot(x,y,a,sp){S.eb.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:4})}
function aim(e,sp,o=0){const T=tgt(e);eshot(e.x,e.y,Math.atan2(T.y-e.y,T.x-e.x)+o,sp)}
function hurt(e,d){e.hp-=d;e.hf=.08;burst(e.x,e.y,2,'#ffd',120);if(e.hp<=0&&!e.dead)kill(e)}
function drop(){const r=Math.random();return r<.25?'H':r<.4?'P':'MSLO'[Math.random()*4|0]}
function kill(e){const s=S,B=e.k=='b';e.dead=1;s.sc+=e.sc;burst(e.x,e.y,B?70:14,'#fa4',B?340:180);s.sh=B?25:6;
 if(B){s.boss=0;s.ph=2;s.ct=4;s.eb=[];s.msg='STAGE '+s.st+' CLEAR';s.mt=4;s.it.push({x:e.x-20,y:e.y,k:'H'},{x:e.x+20,y:e.y,k:'MSLO'[Math.random()*4|0]})}
 else if(Math.random()<.035)s.it.push({x:e.x,y:e.y,k:drop()})}
function hit(p,d){const s=S;if(p.inv>0||p.dead||s.over)return;p.hp-=d;p.inv=.7;p.hf=.12;s.sh=Math.max(s.sh,12);burst(p.x,p.y,10,'#fff',160);
 if(p.hp<=0){p.hp=0;p.dead=1;p.rv=5;burst(p.x,p.y,60,'#f84',300);if(!alive().length)s.over=true}}
function chain(p,l){const s=S;let c={x:p.x,y:p.y-10},used=[];for(let k=0;k<2+l;k++){let b=null,bd=330;for(const e of s.e){if(used.includes(e)||e.y<-10)continue;const d=D(c,e);if(d<bd){bd=d;b=e}}if(!b)break;used.push(b);s.L.push({a:c,b:{x:b.x,y:b.y},t:.14});hurt(b,3+l);c={x:b.x,y:b.y}}}
const optp=(p,k)=>({x:p.x+(k%2?1:-1)*(34+(k>>1)*24),y:p.y+14+(k>>1)*12});
function fire2(p,dt){const s=S,x=p.x,y=p.y-14,c=p.cds,l=p.wl,B=o=>s.b.push(Object.assign({x,y,vx:0,vy:-800,d:1,w:3,h:14,c:'#ff6',hit:new Set()},o));
 for(let i=0;i<5;i++)c[i]-=dt;
 if(c[0]<=0){c[0]=.1;const n=l[0];for(let i=0;i<n;i++)B({x:x+(i-(n-1)/2)*11,vy:-1000,d:1.6,h:30,c:'#7ff',pr:1})}
 if(l[1]&&c[1]<=0){c[1]=.55;const n=l[1]+1;for(let i=0;i<n;i++)B({x:x+(i-(n-1)/2)*16,vx:(i-(n-1)/2)*90,vy:-260,d:4,w:5,h:12,c:'#fb5',hm:1})}
 if(l[2]&&c[2]<=0){c[2]=.28;const n=1+l[2]*2;for(let i=0;i<n;i++){const a=(i-(n-1)/2)*.15;B({vx:Math.sin(a)*700,vy:-Math.cos(a)*700,d:1,c:'#af6'})}}
 if(l[3]&&c[3]<=0){c[3]=.5;chain(p,l[3])}
 if(l[4]&&c[4]<=0){c[4]=.16;for(let k=0;k<l[4]*2;k++){const o=optp(p,k);B({x:o.x,y:o.y,vy:-900,d:.8,w:2,h:10,c:'#fd5'})}}}
function spawn(){const r=Math.random(),s=S,p=Math.min(1,s.tm/SL),m=np();
 if(r<.55-.15*p){const n=3+(Math.random()*3|0),x0=R(100,W-100),d=Math.random()<.5?1:-1;for(let i=0;i<n;i++)s.e.push({k:'z',x:x0,y:-30-i*45,x0,hp:Math.ceil((4+s.st)*m),r:14,t:-i*.3,d,sc:100,fire:R(1,3)})}
 else if(r<.8-.1*p)s.e.push({k:'s',x:R(70,W-70),y:-40,hp:Math.ceil((18+s.st*5)*m),r:24,sc:300,fire:1})
 else s.e.push({k:'v',x:R(40,W-40),y:-30,hp:Math.ceil((5+s.st)*m),r:13,sc:150})}
function upd(dt){const s=S;if(s.over)return;
 s.t+=dt;s.sh=Math.max(0,s.sh-dt*30);s.mt-=dt;s.bg+=60*dt;
 for(const p of s.P){if(!p.on)continue;p.inv-=dt;p.hf-=dt;
  if(p.dead){p.rv-=dt;if(p.rv<=0){p.dead=0;p.hp=50;p.inv=2}continue}
  const i=p.in,sp=340,m=Math.hypot(i.dx,i.dy);
  if(m){p.x+=i.dx/m*sp*dt;p.y+=i.dy/m*sp*dt}
  if(i.d){const tx=i.tx,ty=i.ty-70,mm=Math.hypot(tx-p.x,ty-p.y);if(mm>3){const v=Math.min(mm,sp*1.8*dt);p.x+=(tx-p.x)/mm*v;p.y+=(ty-p.y)/mm*v}}
  p.x=Math.max(20,Math.min(W-20,p.x));p.y=Math.max(90,Math.min(H-40,p.y));fire2(p,dt)}
 if(s.ph==2){s.ct-=dt;if(s.ct<=0)nextStage()}
 else{s.tm+=dt;if(!s.boss){const p=Math.min(1,s.tm/SL);s.sp-=dt;if(s.sp<=0){s.sp=1.1-.5*p;spawn()}
  if(s.tm>=SL){s.boss=1;const h=Math.ceil((400+s.st*500)*np());s.e.push({k:'b',x:W/2,y:-120,hp:h,mh:h,r:55,sc:2000,a:1,b:2,t:0,c:0});s.msg='WARNING: '+ST[(s.st-1)%3].boss;s.mt=3}}}
 for(const e of s.e){e.t=(e.t||0)+dt;if(e.hf>0)e.hf-=dt;const T=tgt(e);
  if(e.k=='z'){e.y+=150*dt;e.x=e.x0+Math.sin(e.t*2.2)*80*e.d;e.fire-=dt;if(e.fire<=0){e.fire=R(1.2,2.4);aim(e,230);if(s.st>1||s.tm>60){aim(e,230,.3);aim(e,230,-.3)}}}
  else if(e.k=='s'){e.y+=60*dt;e.fire-=dt;if(e.fire<=0){e.fire=1.4;for(let i=-2;i<3;i++)aim(e,190,i*.22)}}
  else if(e.k=='v'){e.y+=270*dt;e.x+=Math.sign(T.x-e.x)*150*dt}
  else if(e.y<130)e.y+=60*dt;
  else{const th=(s.st-1)%3,q=e.hp<e.mh/2?.6:1;e.x=W/2+Math.sin(e.t*(.6+th*.3))*150;e.a-=dt;e.b-=dt;
   if(th==0){if(e.a<=0){e.a=.9*q;for(let i=-3;i<=3;i++)eshot(e.x,e.y+30,Math.PI/2+i*.2,230)}
    if(e.b<=0){e.b=3*q;for(let i=0;i<16;i++)eshot(e.x,e.y,i/16*6.283+e.t,150)}}
   else if(th==1){if(e.a<=0){e.a=.18*q+.1;e.c+=.35;eshot(e.x-40,e.y+30,Math.PI/2+Math.sin(e.c)*.9,240);eshot(e.x+40,e.y+30,Math.PI/2-Math.sin(e.c)*.9,240)}
    if(e.b<=0){e.b=2.2*q;for(let i=-1;i<2;i++)aim(e,300,i*.18)}}
   else{if(e.a<=0){e.a=.12;e.c+=.5;eshot(e.x,e.y,e.c,170);eshot(e.x,e.y,e.c+3.14,170)}
    if(e.b<=0){e.b=2.6*q;for(let i=-4;i<=4;i++)eshot(e.x,e.y+30,Math.PI/2+i*.17,260)}}}
  for(const p of alive())if(!e.dead&&D(e,p)<e.r+PR)hit(p,e.k=='b'?25:15)}
 for(const b of s.b){
  if(b.hm){let t=null,bd=1e9;for(const e of s.e){const d=D(b,e);if(d<bd){bd=d;t=e}}
   let a=Math.atan2(b.vy,b.vx);if(t){let da=Math.atan2(t.y-b.y,t.x-b.x)-a;da=Math.atan2(Math.sin(da),Math.cos(da));a+=da*Math.min(1,dt*5)}
   const v=Math.min(560,Math.hypot(b.vx,b.vy)+700*dt);b.vx=Math.cos(a)*v;b.vy=Math.sin(a)*v}
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.y<-40||b.y>H+40||b.x<-40||b.x>W+40)b.dead=1;
  for(const e of s.e){if(e.dead||b.hit.has(e))continue;
   if(Math.abs(b.x-e.x)<e.r+b.w&&Math.abs(b.y-e.y)<e.r+b.h/2){b.hit.add(e);hurt(e,b.d);if(!b.pr){b.dead=1;break}}}}
 for(const b of s.eb){b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)b.dead=1;
  else for(const p of alive())if(D(b,p)<b.r+PR*.7){b.dead=1;hit(p,10);break}}
 for(const i of s.it){i.y+=90*dt;if(i.y>H+20)i.dead=1;
  for(const p of alive())if(!i.dead&&D(i,p)<26){i.dead=1;
   if(i.k=='H'){p.hp=Math.min(100,p.hp+30);s.msg='체력 회복'}
   else{const w='PMSLO'.indexOf(i.k),mx=Math.min(w?3:4,w?s.st:s.st+1);if(p.wl[w]>=mx){s.sc+=500;s.msg='MAX +500'}else{p.wl[w]++;s.msg=WK[w]+' Lv'+p.wl[w]}}
   s.mt=1;burst(i.x,i.y,10,IC[i.k],160)}}
 for(const p of s.p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}
 for(const l of s.L)l.t-=dt;
 s.b=s.b.filter(b=>!b.dead);s.eb=s.eb.filter(b=>!b.dead);s.it=s.it.filter(i=>!i.dead);s.p=s.p.filter(p=>p.t>0);s.L=s.L.filter(l=>l.t>0);
 s.e=s.e.filter(e=>!e.dead&&e.y<H+80)}

/* ---- network ---- */
const info=t=>{$('info').textContent=t};
function send(o){net.ch&&net.ch.send({type:'broadcast',event:'m',payload:o})}
function conn(code,cb){if(!SB_URL||!SB_KEY){info('코드 맨 위의 SB_URL, SB_KEY에 Supabase 정보를 넣어야 온라인이 돼요');return}
 if(typeof supabase=='undefined'){info('온라인 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요');return}
 net.sb=net.sb||supabase.createClient(SB_URL,SB_KEY);
 const ch=net.sb.channel('mecha-'+code,{config:{broadcast:{self:false}}});net.ch=ch;
 ch.on('broadcast',{event:'m'},({payload})=>onMsg(payload)).subscribe(st=>{if(st=='SUBSCRIBED')cb();else if(st=='CHANNEL_ERROR'||st=='TIMED_OUT')info('연결 실패: Supabase 설정과 네트워크를 확인해 주세요')})}
function go(){$('menu').style.display='none';run=true}
function onMsg(m){
 if(net.mode=='host'){
  if(m.t=='join'){if(!net.guest){net.guest=1;if(!net.started){reset(2);net.started=1}else{const p=S.P[1];p.on=true;p.dead=0;p.hp=100;p.x=W/2+60;p.y=H-130}go()}net.last=performance.now();send({t:'ok'})}
  else if(m.t=='in'&&net.guest){S.P[1].in=m.i;net.last=performance.now()}}
 else if(net.mode=='guest'){
  if(m.t=='ok'||m.t=='st'){if(!run){clearInterval(net.jt);go()}}
  if(m.t=='st')applySnap(m.s)}}
function snap(){const s=S,r=Math.round;return{sc:s.sc,st:s.st,tm:s.tm|0,boss:s.boss,ph:s.ph,over:s.over,msg:s.msg,mt:s.mt,sh:s.sh,
 P:s.P.map(p=>[r(p.x),r(p.y),r(p.hp),p.inv>0?1:0,p.dead?1:0,p.on?1:0,p.wl,p.hf>0?1:0]),
 e:s.e.map(e=>[r(e.x),r(e.y),e.k,e.hf>0?1:0,r(e.hp),r(e.mh||0),e.r]),
 b:s.b.map(b=>[r(b.x),r(b.y),b.w,b.h,b.c,r(b.vx),r(b.vy)]),eb:s.eb.map(b=>[r(b.x),r(b.y),r(b.vx),r(b.vy)]),
 it:s.it.map(i=>[r(i.x),r(i.y),i.k]),L:s.L.map(l=>[r(l.a.x),r(l.a.y),r(l.b.x),r(l.b.y)]),q:s.q}}
function applySnap(p){const o=S;Object.assign(o,{sc:p.sc,st:p.st,tm:p.tm,boss:p.boss,ph:p.ph,over:p.over,msg:p.msg,mt:p.mt,sh:p.sh});
 o.P=p.P.map(a=>({x:a[0],y:a[1],hp:a[2],inv:a[3],dead:a[4],on:a[5],wl:a[6],hf:a[7]}));
 o.e=p.e.map(a=>({x:a[0],y:a[1],k:a[2],hf:a[3],hp:a[4],mh:a[5],r:a[6]}));
 o.b=p.b.map(a=>({x:a[0],y:a[1],w:a[2],h:a[3],c:a[4],vx:a[5],vy:a[6]}));
 o.eb=p.eb.map(a=>({x:a[0],y:a[1],vx:a[2],vy:a[3],r:4}));
 o.it=p.it.map(a=>({x:a[0],y:a[1],k:a[2]}));
 o.L=p.L.map(a=>({a:{x:a[0],y:a[1]},b:{x:a[2],y:a[3]}}));
 for(const q of p.q)burst(...q);net.rt=performance.now()}
function hostNet(dt){if(!net.guest){S.q=[];return}net.sa+=dt;
 if(net.sa>=.055){net.sa=0;send({t:'st',s:snap()});S.q=[]}
 if(performance.now()-net.last>6000){net.guest=0;S.P[1].on=false;S.P[1].dead=0}}
function gupd(dt){const s=S,n=performance.now();s.t+=dt;s.bg+=60*dt;
 for(const b of s.b){b.x+=b.vx*dt;b.y+=b.vy*dt}for(const b of s.eb){b.x+=b.vx*dt;b.y+=b.vy*dt}
 for(const p of s.p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}s.p=s.p.filter(p=>p.t>0);
 if(n-net.ti>33){net.ti=n;send({t:'in',i:localIn()})}}

/* ---- draw ---- */
function poly(pts,c){X.fillStyle=c;X.beginPath();pts.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.closePath();X.fill()}
function drawShip(p,i){if(!p.on||p.dead)return;const c=p.hf>0?'#fff':(i?'#f98':'#7df');
 X.save();X.translate(p.x,p.y);if(p.inv>0&&((S.t*20)|0)%2)X.globalAlpha=.4;
 poly([[0,-22],[7,2],[24,16],[7,12],[0,18],[-7,12],[-24,16],[-7,2]],c);X.fillStyle='#fff';X.fillRect(-2,-10,4,8);X.fillStyle='#fa4';X.fillRect(-3,18,6,R(5,12));X.restore()}
function drawEnemy(e){X.save();X.translate(e.x,e.y);const c=e.hf>0?'#fff':null;
 if(e.k=='z')poly([[0,14],[14,-10],[0,-4],[-14,-10]],c||'#9ab');
 else if(e.k=='v')poly([[0,16],[13,-10],[-13,-10]],c||'#e55');
 else if(e.k=='s'){const th=(S.st-1)%3;if(th==0){X.fillStyle=c||'#6a5a2a';X.fillRect(-20,-24,40,48);X.fillStyle=c||'#4a4a2a';X.fillRect(-10,-10,20,20);X.fillStyle='#222';X.fillRect(-3,0,6,30)}else if(th==2)poly([[0,-26],[22,-12],[22,12],[0,26],[-22,12],[-22,-12]],c||'#889');else{X.fillStyle=c||'#455';X.fillRect(-18,-38,36,76);X.fillStyle=c||'#678';X.fillRect(-12,-20,24,30)}X.fillStyle=th==2?'#4cf':'#d44';X.beginPath();X.arc(0,0,6,0,6.283);X.fill()}
 else{poly([[0,60],[30,20],[70,10],[70,-20],[30,-40],[-30,-40],[-70,-20],[-70,10],[-30,20]],c||'#567');X.fillStyle=c||'#789';X.fillRect(-18,-30,36,60);X.fillStyle='#e44';X.beginPath();X.arc(0,0,12,0,6.283);X.fill()}
 X.restore()}
function draw(){const s=S;X.save();if(s.sh>0)X.translate(R(-s.sh,s.sh),R(-s.sh,s.sh));
 const th=(s.st-1)%3,g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,ST[th].bg[0]);g.addColorStop(1,ST[th].bg[1]);X.fillStyle=g;X.fillRect(-20,-20,W+40,H+40);
 if(th==2){X.fillStyle='#fff';for(const t of stars){X.globalAlpha=t.a;X.fillRect(t.x,(t.y+s.bg*t.z)%H,t.z,t.z)}X.globalAlpha=1}
 X.strokeStyle=th?'#ffffff22':'#00000018';X.lineWidth=2;for(let i=0;i<(th==2?0:14);i++){const y=(i*70+s.bg)%(H+70)-35;X.beginPath();for(let x=0;x<=W;x+=24)X.lineTo(x,y+Math.sin(x/30+i)*4);X.stroke()}
 for(const o of isl){const y=(o.y+s.bg)%(H+200)-100;X.fillStyle=ISC[th][0];X.beginPath();X.ellipse(o.x,y,o.w/2+6,o.h/2+6,0,0,6.283);X.fill();X.fillStyle=ISC[th][1];X.beginPath();X.ellipse(o.x,y,o.w/2-4,o.h/2-4,0,0,6.283);X.fill()}
 for(const i of s.it){X.fillStyle=IC[i.k];X.beginPath();X.arc(i.x,i.y,12,0,6.283);X.fill();X.fillStyle='#012';X.font='bold 14px sans-serif';X.textAlign='center';X.fillText(i.k,i.x,i.y+5)}
 s.e.forEach(drawEnemy);
 for(const b of s.b){X.fillStyle=b.c;X.fillRect(b.x-b.w,b.y-b.h/2,b.w*2,b.h)}
 for(const b of s.eb){X.fillStyle='#f44';X.beginPath();X.arc(b.x,b.y,b.r,0,6.283);X.fill();X.fillStyle='#fcc';X.beginPath();X.arc(b.x,b.y,b.r-2,0,6.283);X.fill()}
 X.strokeStyle='#ff9';X.lineWidth=3;for(const l of s.L){X.beginPath();X.moveTo(l.a.x,l.a.y);for(let k=1;k<5;k++)X.lineTo(l.a.x+(l.b.x-l.a.x)*k/5+R(-8,8),l.a.y+(l.b.y-l.a.y)*k/5+R(-8,8));X.lineTo(l.b.x,l.b.y);X.stroke()}
 s.P.forEach(drawShip);
 for(const p of s.P)if(p.on&&!p.dead)for(let k=0;k<p.wl[4]*2;k++){const o=optp(p,k);X.fillStyle='#fd5';X.beginPath();X.arc(o.x,o.y,6,0,6.283);X.fill();X.fillStyle='#fff';X.fillRect(o.x-1,o.y-5,2,6)}
 for(const p of s.p){X.globalAlpha=Math.min(1,p.t*2);X.fillStyle=p.c;X.fillRect(p.x,p.y,p.r,p.r)}X.globalAlpha=1;
 X.restore();
 const me=net.mode=='guest'?1:0,mp=s.P[me],o=s.P[1-me];
 X.fillStyle='#0008';X.fillRect(10,10,170,14);X.fillStyle=mp.hp>30?'#3d5':'#f54';X.fillRect(12,12,166*mp.hp/100,10);
 if(o.on){X.fillStyle='#0008';X.fillRect(10,27,170,9);X.fillStyle=o.dead?'#555':(me?'#7df':'#f98');X.fillRect(11,28,168*o.hp/100,7)}
 X.fillStyle='#fff';X.font='bold 16px sans-serif';X.textAlign='right';X.fillText('SCORE '+s.sc,W-12,24);
 X.textAlign='center';X.font='12px sans-serif';X.fillText('STAGE '+s.st,W/2+20,18);X.fillStyle='#0008';X.fillRect(W/2-30,24,100,5);X.fillStyle='#ffd34d';X.fillRect(W/2-30,24,100*Math.min(1,s.tm/SL),5);X.fillStyle='#fff';
 X.textAlign='left';
 for(let i=0;i<5;i++){X.fillStyle=mp.wl[i]?IC['PMSLO'[i]]:'#ffffff30';X.fillRect(12+i*34,42,30,20);X.fillStyle=mp.wl[i]?'#012':'#fffa';X.font='bold 12px sans-serif';X.fillText('PMSLO'[i]+(mp.wl[i]||''),16+i*34,56)}
 const bo=s.e.find(e=>e.k=='b');if(bo){X.fillStyle='#0008';X.fillRect(80,76,320,8);X.fillStyle='#e44';X.fillRect(80,76,320*Math.max(0,bo.hp)/bo.mh,8)}
 X.textAlign='center';
 if(s.mt>0){X.fillStyle='#fff';X.font='bold 26px sans-serif';X.fillText(s.msg,W/2,H/2-120)}
 if(mp.dead&&!s.over){X.fillStyle='#fffc';X.font='bold 18px sans-serif';X.fillText('쓰러졌어요 · 곧 부활해요',W/2,H/2)}
 if(s.t<6&&!s.over&&!mp.dead){X.fillStyle='#fffc';X.font='14px sans-serif';X.fillText('이동: WASD·방향키·화면 드래그 (자동 발사)',W/2,H/2);X.fillText('무기 아이템 M·S·L·O로 무기를 추가하고, P는 레이저, H는 체력 회복',W/2,H/2+22);if(o.on)X.fillText('동료가 쓰러지면 5초 뒤 부활해요 · 둘 다 쓰러지면 게임오버',W/2,H/2+44)}
 if(net.mode=='guest'&&performance.now()-net.rt>5000){X.fillStyle='#000b';X.fillRect(0,0,W,H);X.fillStyle='#fff';X.font='bold 22px sans-serif';X.fillText('연결이 끊겼어요',W/2,H/2)}
 else if(s.over){X.fillStyle='#000a';X.fillRect(0,0,W,H);X.fillStyle='#fff';X.font='bold 36px sans-serif';X.fillText('GAME OVER',W/2,H/2-10);X.font='18px sans-serif';X.fillText('SCORE '+s.sc+(net.mode=='guest'?' · 방장이 다시 시작하면 이어져요':' · 클릭/Enter: 이 스테이지 다시 시작'),W/2,H/2+26)}}

 if(run){if(net.mode=='guest')gupd(dt);else{S.P[0].in=localIn();upd(dt);if(net.mode=='host')hostNet(dt)}draw()}
 requestAnimationFrame(loop)}
